      <stop offset="0" stop-color="#d49a66"/>
      <stop offset="1" stop-color="#b0794f"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#6f5c44" flood-opacity="0.20"/></filter>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
