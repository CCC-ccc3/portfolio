<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7efe1"/>
      <stop offset="1" stop-color="#eddcc0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#e3b882" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e3b882" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cba6"/>
      <stop offset="1" stop-color="#e5b788"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3329"/>
      <stop offset="1" stop-color="#241e17"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0a079"/>
      <stop offset="1" stop-color="#9c7f5c"/>
    </linearGradient>
    <clipPath id="c"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <!-- 背景：柔和奶油 + 轻微暖光 -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <circle cx="96" cy="440" r="190" fill="#c99257" opacity="0.10"/>

    <!-- 上衣（无描边，柔过渡） -->
    <path d="M-20 560 C80 330 360 330 540 560 Z" fill="url(#shirt)"/>
    <path d="M120 560 C150 400 240 330 300 330 C280 430 250 500 200 560 Z" fill="#000000" opacity="0.06"/>

    <!-- 颈部 -->
    <path d="M232 296 L214 380 Q256 404 298 380 L280 296 Q256 288 232 296 Z" fill="url(#skin)"/>

    <!-- 脸 -->
    <ellipse cx="256" cy="272" rx="92" ry="108" fill="url(#skin)"/>

    <!-- 耳部柔筋 -->
    <path d="M168 262 a16 20 0 1 0 0 24" fill="#ecc9a3" opacity="0.7"/>
    <path d="M344 262 a16 20 0 1 0 0 24" fill="#ecc9a3" opacity="0.7"/>

    <!-- 头发：简约现代短发，柔和 -->
    <path d="M152 252 C148 150 208 112 256 112 C312 112 366 152 360 252
             C370 236 322 196 292 208 C306 190 262 168 240 184
             C232 170 174 192 152 252 Z" fill="url(#hair)"/>
    <path d="M152 252 C156 186 200 140 256 140 C312 140 356 186 360 252
             C358 214 330 180 296 176 C276 174 238 176 222 190
             C206 204 158 218 152 252 Z" fill="#4a3d30" opacity="0.55"/>

    <!-- 眉眼（极淡、无描边） -->
    <path d="M210 250 q20-9 44-3" stroke="#6e5a43" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M258 247 q22-6 44 3" stroke="#6e5a43" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- 眼睛 -->
    <ellipse cx="232" cy="276" rx="9" ry="11" fill="#3a2c23"/>
    <ellipse cx="280" cy="276" rx="9" ry="11" fill="#3a2c23"/>
    <circle cx="235" cy="271" r="3" fill="#ffffff" opacity="0.75"/>
    <circle cx="283" cy="271" r="3" fill="#ffffff" opacity="0.75"/>

    <!-- 鼻梁柔影 -->
    <path d="M252 288 q4 12 10 16" stroke="#d9a675" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- 唇 -->
    <path d="M242 330 q14 12 28 0" stroke="#c58a63" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- 下颌柔光 -->
    <path d="M200 340 Q256 388 312 340" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.22"/>
  </g>
</svg>